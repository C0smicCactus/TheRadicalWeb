<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>The Radical</title>
		
		<!-- Prevent Flash of Unstyled Content for Dark Mode -->
		<script>
			if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		</script>
		
		<script>
			(function() {
				try {
					var targets = [globalThis, typeof window !== 'undefined' ? window : null];
					for (var i = 0; i < targets.length; i++) {
						var t = targets[i];
						if (!t) continue;
						try {
							t.fetch = t.fetch;
						} catch (e) {
							(function(target) {
								var _f = target.fetch;
								Object.defineProperty(target, 'fetch', {
									get: function() { return _f; },
									set: function(v) { _f = v; },
									configurable: true,
									enumerable: true
								});
							})(t);
						}
					}
				} catch (_) {}
			})();
		</script>
		<!-- Google Fonts: Manrope & Space Grotesk -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&family=Space+Grotesk:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
		<!-- Font Awesome 6 -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
