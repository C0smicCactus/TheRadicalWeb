<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>The Radical</title>
		<meta name="description" content="An independent news aggregator centralising reporting from Australian political and social perspectives." />
		<!-- Link previews (chat apps, social media) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="The Radical" />
		<meta property="og:description" content="An independent news aggregator centralising reporting from Australian political and social perspectives." />
		<meta property="og:url" content="https://c0smiccactus.github.io/TheRadicalWeb/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		
		<!-- Prevent Flash of Unstyled Content for Dark Mode -->
		<script>
			if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		</script>
		
		<script>
			(function() {
				try {
					var targets = [globalThis, typeof window !== 'undefined' ? window : null];
					for (var i = 0; i < targets.length; i++) {
						var t = targets[i];
						if (!t) continue;
						try {
							t.fetch = t.fetch;
						} catch (e) {
							(function(target) {
								var _f = target.fetch;
								Object.defineProperty(target, 'fetch', {
									get: function() { return _f; },
									set: function(v) { _f = v; },
									configurable: true,
									enumerable: true
								});
							})(t);
						}
					}
				} catch (_) {}
			})();
		</script>
		<!-- Google Fonts: Manrope & Space Grotesk -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&family=Space+Grotesk:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
		<!-- Font Awesome 6, loaded into a cascade layer between Tailwind's base styles and its utilities,
		     so classes like text-lg can still size icons (Tailwind 4 puts its CSS in layers, which lose to unlayered CSS).
		     The layer list matches Tailwind's own order, with fontawesome added after base. -->
		<style>
			@layer properties, theme, base, fontawesome, components, utilities;
			@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css') layer(fontawesome);
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
