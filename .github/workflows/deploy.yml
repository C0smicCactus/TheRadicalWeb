name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  schedule:
    - cron: '0 * * * *' # Runs automatically at minute 0 of every hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

# The build and the deploy are two jobs on purpose. When the upload and the
# deploy run back to back in one job, deploy-pages looks up the artifact a
# fraction of a second after the upload finishes and sometimes finds nothing,
# even though the artifact exists (actions/deploy-pages#451). A separate job
# starts several seconds later, which gives GitHub time to index the artifact.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
